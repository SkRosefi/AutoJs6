name: Android CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Fix Gradle Version to 8.10.2
        run: |
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Install CMake 3.10.2 manually
        run: |
          wget https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          chmod +x cmake-3.10.2-Linux-x86_64.sh
          sudo ./cmake-3.10.2-Linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (assembleInrtRelease)
        run: ./gradlew assembleInrtRelease --stacktrace

      - name: Build with Gradle (assembleAppRelease)
        run: ./gradlew assembleAppRelease --stacktrace

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64-apk
          path: app/build/outputs/apk/app/release/*-arm64-v8a.apk
        continue-on-error: true

      - name: Upload armv7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-armv7-apk
          path: app/build/outputs/apk/app/release/*-v7a.apk
        continue-on-error: true

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-universal-apk
          path: app/build/outputs/apk/app/release/*-universal.apk
        continue-on-error: true
